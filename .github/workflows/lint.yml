name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Check Automatis skills and manifests
        run: ./scripts/vendor-automatis-commands --check
